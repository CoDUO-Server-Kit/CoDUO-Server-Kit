#!/usr/sbin/nft -f
# Firewall del servidor de juegos (instalar.sh completa @PUERTO@ y @RED_CASA@)
flush ruleset

table inet filtro {
	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state invalid drop

		# Consultas "sin conexion" del juego (empiezan con FF FF FF FF: getstatus, getinfo,
		# getchallenge, connect, rcon). Hasta 8 por segundo por IP: evita que usen el servidor
		# para amplificar ataques contra otros y frena a quien pruebe claves de rcon.
		# Va ANTES de "established": si no, una IP que ya consulto pasaria sin limite.
		udp dport @PUERTO@ @th,64,32 0xffffffff meter consultas_cod { ip saddr limit rate over 8/second burst 16 packets } drop

		ct state established,related accept

		# Juego: abierto a todos
		udp dport @PUERTO@ accept

		# Administracion: solo desde la red de casa
		ip saddr @RED_CASA@ tcp dport 22 accept
		ip saddr @RED_CASA@ icmp type echo-request accept
		icmp type echo-request limit rate 2/second accept

		# IPv6 basico (descubrimiento de vecinos)
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
