<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="520" rx="18" fill="#181a20"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0b4"/>
    </marker>
  </defs>
  <text x="480" y="44" text-anchor="middle" fill="#e8be3c" font-size="24" font-weight="bold">CoDUO Server Kit - como funciona</text>

  <!-- Administrador -->
  <rect x="40" y="90" width="250" height="150" rx="14" fill="#22252e" stroke="#5b63f1" stroke-width="2"/>
  <text x="165" y="122" text-anchor="middle" fill="#e6e6eb" font-size="18" font-weight="bold">PC del administrador</text>
  <text x="60" y="152" fill="#9aa0b4" font-size="14">maestro\MiMod  (pk3 del mod)</text>
  <text x="60" y="176" fill="#9aa0b4" font-size="14">Armar_Pk3.py  (arreglos, bots)</text>
  <text x="60" y="200" fill="#9aa0b4" font-size="14">Auditar_Conflictos.py</text>
  <text x="60" y="224" fill="#9aa0b4" font-size="14">Publicar_Actualizacion.ps1</text>

  <!-- GitHub -->
  <rect x="355" y="90" width="250" height="150" rx="14" fill="#22252e" stroke="#e8be3c" stroke-width="2"/>
  <text x="480" y="122" text-anchor="middle" fill="#e6e6eb" font-size="18" font-weight="bold">GitHub (repo privado)</text>
  <text x="375" y="152" fill="#9aa0b4" font-size="14">release "mod": archivos +</text>
  <text x="375" y="172" fill="#9aa0b4" font-size="14">  manifest.json (SHA-256)</text>
  <text x="375" y="198" fill="#9aa0b4" font-size="14">release "stats": top del mes</text>
  <text x="375" y="224" fill="#9aa0b4" font-size="14">Actions: cada 30 min</text>

  <!-- Servidor -->
  <rect x="670" y="90" width="250" height="150" rx="14" fill="#22252e" stroke="#d67c1e" stroke-width="2"/>
