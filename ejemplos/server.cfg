// ================================================================
// server.cfg de ejemplo para CoD UO 1.51 con CoDUO Server Kit
// Va en <servidor>/MiMod/server.cfg  (y autoexec_mp.cfg con: exec server.cfg)
// ================================================================

// --- Identidad ---
set sv_hostname "^1Mi ^7Servidor"
set scr_motd "Bienvenidos"
set sv_maxclients "16"

// --- Seguridad: CAMBIAR ---
set rconpassword "UNA_CLAVE_LARGA_Y_PROPIA"
set g_password ""

// --- Solo entra quien tiene los mismos pk3 (los reparte el launcher) ---
set sv_pure "1"
set sv_allowDownload "0"
set sv_wwwDownload "0"
set sv_wwwBaseURL ""

// --- Registro de partidas (lo usa el TOP DEL MES) ---
set g_log "games_mp.log"
set g_logsync "0"
set logfile "1"

// --- Modo y rotacion ---
set g_gametype "tdm"
// rotacion vacia = repite el mismo mapa y modo al terminar
set sv_mapRotation ""

// --- Votaciones ---
set g_allowvote "1"

// --- Vida de los jugadores (requiere el pk3 de arreglos: Armar_Pk3.py fixes). 0 = 100 normal ---
set kit_player_health "0"

// --- Opciones del mod AWE en otro archivo ---
exec "awe.cfg"
